name: Mise à jour des coins
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update.yml"
      - "fetch-coins.mjs"
      - "images.mjs"
      - "pairs.mjs"
      - "fees.mjs"
permissions:
  contents: write
concurrency:
  group: coins
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repartir de la dernière version
        run: |
          # Une exécution mise en file d'attente travaillerait sinon sur une ancienne version des données.
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les outils (images, blockchain)
        run: npm install --no-save sharp@0.33.5 @solana/web3.js@1.98.0 || true
      - name: Chercher de nouveaux coins
        run: |
          N=$(node -e 'let n=0;try{n=require("./coins.json").length}catch(e){};console.log(Math.min(40,Math.max(20,Math.ceil(n/6)+2)))')
          timeout 20m node fetch-coins.mjs $N || true
      - name: Télécharger les logos
        run: timeout 8m node images.mjs || true
      - name: Ajouter les paires de trading
        run: timeout 5m node pairs.mjs || true
      - name: Lire le partage des fees (blockchain)
        run: timeout 5m node fees.mjs || true
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "coins-bot"
          git config user.email "coins-bot@users.noreply.github.com"
          git add coins.json artifact/coins-img.json
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -m "Nouveaux coins"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
