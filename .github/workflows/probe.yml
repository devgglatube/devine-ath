name: Sonde (diagnostic ponctuel)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @solana/web3.js@1.98.0
      - run: timeout 8m node probe.mjs || true
      - name: Enregistrer le résultat
        run: |
          git config user.name "coins-bot"
          git config user.email "coins-bot@users.noreply.github.com"
          git add -f probe.json
          if git diff --cached --quiet; then echo "rien"; exit 0; fi
          git commit -m "Résultat de la sonde"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
