name: Sonde logos et fees
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @solana/web3.js@1.98.0
      - run: timeout 8m node probe.mjs || true
      - run: |
          git config user.name "coins-bot"
          git config user.email "coins-bot@users.noreply.github.com"
          git add -f probe.json
          git commit -m "Résultat de la sonde" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
