name: Tweets des coins
on:
  workflow_dispatch:
  push:
    paths:
      - "tweets.mjs"
      - ".github/workflows/tweets.yml"
permissions:
  contents: write
concurrency:
  group: coins
  cancel-in-progress: false
jobs:
  tweets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repartir de la dernière version
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les outils (images, blockchain)
        run: npm install --no-save sharp@0.33.5 @solana/web3.js@1.98.0 || true
      - name: Chercher les tweets des coins
        run: timeout 8m node tweets.mjs || true
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "coins-bot"
          git config user.email "coins-bot@users.noreply.github.com"
          git add artifact/tweets.json
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -m "Tweets des coins"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
