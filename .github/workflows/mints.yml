name: Adresses des anciens coins
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Coins à refaire même s'ils ont déjà une adresse (TICKER|Nom, séparés par des virgules)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: mints
  cancel-in-progress: false
jobs:
  mints:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repartir de la dernière version
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher l'adresse des coins qui n'en ont pas
        env:
          FORCE_KEYS: ${{ github.event.inputs.force }}
        run: timeout 14m node mints.mjs || true
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "coins-bot"
          git config user.email "coins-bot@users.noreply.github.com"
          git add artifact/ca-map.json
          git add -f mints-report.json || true
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -m "Adresses des anciens coins [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
